name: Scaleio
description: 'ScaleIO was a software-defined block storage startup (an early Norwest Venture
  Partners investment) that was acquired by EMC in 2013 and folded into Dell EMC as ScaleIO,
  later renamed VxFlex OS and then PowerFlex. It is no longer an independent company: the
  scaleio.com domain is Dell-managed and 301-redirects to the Dell EMC software-defined
  storage product page, and there is no independent developer portal, API, or SDK surface
  under this brand. Any current API surface lives under Dell PowerFlex, not scaleio.com.'
